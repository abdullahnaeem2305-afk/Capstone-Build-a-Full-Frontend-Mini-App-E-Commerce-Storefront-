<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LuxeMart — Premium E-Commerce Storefront</title>
    <meta name="description" content="Discover premium products with exceptional quality at LuxeMart. Browse curated collections of clothing, electronics, and jewelry with free shipping on orders over $50." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ══════════════════════════════════════════════════════
         HEADER
    ══════════════════════════════════════════════════════ -->
    <header class="site-header">
        <div class="container">
            <a class="brand" href="#/" aria-label="LuxeMart Home">
                <div class="brand-mark">L</div>
                <span>LuxeMart</span>
            </a>

            <nav>
                <ul class="site-nav" id="desktop-nav">
                    <li><a class="nav-link active" href="#/">Home</a></li>
                    <li>
                        <a class="nav-link nav-cart" href="#/cart" aria-label="Shopping cart">
                            <svg class="nav-cart-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="9" cy="21" r="1"/>
                                <circle cx="20" cy="21" r="1"/>
                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                            </svg>
                            Cart
                            <span class="cart-badge" id="cart-badge" aria-live="polite">0</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Mobile menu button -->
            <button class="mobile-menu-btn" id="mobile-menu-btn"
                    aria-label="Toggle navigation menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- Mobile navigation overlay -->
    <div class="mobile-nav" id="mobile-nav">
        <a class="nav-link" href="#/" onclick="document.getElementById('mobile-nav').classList.remove('active');document.getElementById('mobile-menu-btn').classList.remove('active')">Home</a>
        <a class="nav-link" href="#/cart" onclick="document.getElementById('mobile-nav').classList.remove('active');document.getElementById('mobile-menu-btn').classList.remove('active')">Cart</a>
    </div>

    <!-- ══════════════════════════════════════════════════════
         MAIN — SPA RENDER TARGET
    ══════════════════════════════════════════════════════ -->
    <main id="app"></main>

    <!-- ══════════════════════════════════════════════════════
         FOOTER
    ══════════════════════════════════════════════════════ -->
    <footer class="site-footer">
        <p>Built with ♥ using vanilla HTML, CSS & JavaScript — <strong>Week 6 Capstone</strong></p>
        <p style="margin-top: 4px; font-size: .8125rem;">Reusing the <strong>Week 5 UI Kit</strong> · Powered by <a href="https://fakestoreapi.com" target="_blank" rel="noopener" style="color: var(--color-primary); text-decoration: none;">Fake Store API</a></p>
    </footer>

    <!-- ══════════════════════════════════════════════════════
         SCRIPTS — loaded in dependency order
    ══════════════════════════════════════════════════════ -->
    <!-- Core infrastructure -->
    <script src="router.js"></script>
    <script src="api.js"></script>
    <script src="store.js"></script>

    <!-- UI Components (Week 5 Kit) -->
    <script src="button.js"></script>
    <script src="card.js"></script>
    <script src="modal.js"></script>
    <script src="toast.js"></script>

    <!-- Pages -->
    <script src="home.js"></script>
    <script src="product.js"></script>
    <script src="cart.js"></script>
    <script src="checkout.js"></script>

    <!-- App entry point (must be last) -->
    <script src="app.js"></script>
</body>
</html>
